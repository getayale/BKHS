name: mini_school_app

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  http: ^1.5.0
  excel: ^4.0.6
  path_provider: ^2.1.5
  universal_html: ^2.3.0
  file_picker: ^13.1.0
  file_saver: ^0.6.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.webp

flutter_launcher_icons:
  android: true
  
  image_path: "assets/logo.webp"